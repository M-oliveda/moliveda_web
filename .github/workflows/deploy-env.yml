# Reusable: long-lived gated environments (MASTERPLAN 10.2). Called by ci.yml after
# `CI passed` on a push: `develop` deploys development, `release/**` deploys staging.
name: Deploy environment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push-deploy.yml
    with:
      github_environment: develop
      deploy_environment: development
    secrets: inherit

  staging:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push-deploy.yml
    with:
      github_environment: staging
      deploy_environment: staging
    secrets: inherit
